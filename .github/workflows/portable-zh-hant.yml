# 日漫→繁體中文 CPU 免安裝版：Windows 打包並發布到 Release
# 內附全部模型；因單一檔案上限 2 GiB，分成數個普通 zip，全部解壓到同一資料夾即可使用
name: Portable zh-Hant CPU build

on:
  push:
    branches:
      - claude/saber-translation-upgrade-ut9pti
    paths-ignore:
      - '**.md'
      - 'tests_backend/**'
      - 'vue-frontend/tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-zh-hant
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  PIP_NO_CACHE_DIR: '1'
  UPSTREAM_REPO: MashiroSaber03/Saber-Translator
  MODELS_RELEASE_TAG: models-storage
  RELEASE_TAG: galaxy-zh-hant-cpu
  PACKAGE_NAME: Saber-Translator-zhHant-CPU
  # GitHub Release 單一檔案上限 2 GiB（以未壓縮大小切分，保證每個分卷都在上限內）
  PART_LIMIT_BYTES: '1950000000'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          $androidSdk = 'C:\Android\android-sdk'
          if (Test-Path -LiteralPath $androidSdk) { Remove-Item -LiteralPath $androidSdk -Recurse -Force }
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1))
          Write-Host ("Available disk: {0:N1} GiB" -f ($drive.Free / 1GB))

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download offline models (upstream models-storage release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:MODELS_RELEASE_TAG --repo $env:UPSTREAM_REPO --pattern "models.z*" --dir .
          7z x models.zip -y | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'models.z*' -File | Remove-Item -Force
          python .github/scripts/check_models.py models

      - name: Add LaMA Manga model (default inpainting)
        run: |
          New-Item -ItemType Directory -Force -Path models\lama-manga | Out-Null
          Invoke-WebRequest -Uri 'https://huggingface.co/mayocream/lama-manga/resolve/main/lama-manga.safetensors' -OutFile models\lama-manga\lama-manga.safetensors
          $size = (Get-Item models\lama-manga\lama-manga.safetensors).Length
          if ($size -lt 50MB) { throw "lama-manga download looks wrong: $size bytes" }

      - name: List bundled models
        run: |
          Get-ChildItem models -Directory | ForEach-Object {
            $mb = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            Write-Host ("  {0,-24} {1,8:N0} MB" -f $_.Name, $mb)
          }

      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0+cpu" "torchvision==0.26.0+cpu" --index-url "https://download.pytorch.org/whl/cpu"
          python -m pip install -r requirements-cpu.txt

      - name: Build with PyInstaller
        env:
          SABER_BUILD_MOVE_MODELS: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pyinstaller app.spec --noconfirm

      - name: Probe packaged app
        run: python .github/scripts/probe_package.py dist/Saber-Translator/Saber-Translator.exe

      - name: Verify every model is bundled
        run: |
          python .github/scripts/check_models.py dist/Saber-Translator/_internal/models
          if (-not (Test-Path dist\Saber-Translator\_internal\models\lama-manga\lama-manga.safetensors)) { throw 'lama-manga missing from bundle' }

      - name: Add guide and first-run notes
        run: |
          Copy-Item GALAXY_BOOK_ZH_HANT_GUIDE.md dist\Saber-Translator\
          Copy-Item packaging\README_FIRST.txt dist\Saber-Translator\
          $longest = Get-ChildItem dist\Saber-Translator -Recurse -File |
            ForEach-Object { $_.FullName.Substring((Resolve-Path dist).Path.Length + 1).Length } |
            Measure-Object -Maximum
          Write-Host "Longest path inside the package: $($longest.Maximum) characters"

      - name: Create zip parts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/pack_parts.py dist $env:PACKAGE_NAME $env:PART_LIMIT_BYTES
          Get-ChildItem "$env:PACKAGE_NAME-part*.zip" | ForEach-Object {
            7z t $_.FullName | Select-Object -Last 2 | Out-Host
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Set-Content "$env:PACKAGE_NAME.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag 2>$null
          $PSNativeCommandUseErrorActionPreference = $true
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $parts = @(Get-ChildItem "$env:PACKAGE_NAME-part*.zip" | Sort-Object Name | ForEach-Object { $_.Name })
          $partCount = $parts.Count
          $notes = @"
          日漫→繁體中文（台灣／香港）CPU 免安裝版，建置自 $sha。

          內附全部模型。因 GitHub 單一檔案上限 2GB，分成 $partCount 個 zip：

          1. 下載下方所有 $env:PACKAGE_NAME-part*.zip。
          2. 每一個都用 Windows「全部解壓縮」解到同一個資料夾，例如 C:\ST（不要放 Program Files）。
             解完會得到一個 Saber-Translator 資料夾。缺任何一個分卷都可能無法執行。
          3. 雙擊 Saber-Translator\Saber-Translator.exe（出現 SmartScreen 時按「其他資訊」→「仍要執行」）。
          4. 在「設定 → 翻译服务」貼上 DeepSeek API Key。

          詳見資料夾內的 README_FIRST.txt。
          "@
          $notes | Set-Content -Encoding utf8 notes.md
          gh release create $env:RELEASE_TAG @parts "$env:PACKAGE_NAME.sha256" --target $env:GITHUB_SHA --title "繁中免安裝版 (CPU) $sha" --notes-file notes.md --prerelease
