# 量測 MangaOCR 在難辨識字型上的準確率（原本 vs. 加強版），不會發布任何東西。
# Triggered by pushes that change only this file.
name: Evaluate OCR accuracy

on:
  push:
    branches:
      - claude/saber-translation-upgrade-ut9pti
    paths:
      - '.github/workflows/eval-ocr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install MangaOCR (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.15.0" "manga-ocr==0.1.16" numpy pillow
      - name: Evaluate
        run: python .github/scripts/eval_ocr.py fonts --save-dir samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-samples
          path: samples
